name: Daily arXiv Robotics Digest

on:
  schedule:
    # 02:15 UTC = 10:15 Asia/Shanghai. arXiv announces papers on weekdays.
    - cron: "15 2 * * 1-5"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the email (false = preview only in Actions log)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, filter, translate, and email arXiv papers
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_MODE: ${{ secrets.SMTP_MODE }}
          EVENT_NAME: ${{ github.event_name }}
          SEND_EMAIL: ${{ inputs.send_email }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$SEND_EMAIL" = "true" ]; then
            python send_translated_digest.py
          else
            python send_translated_digest.py --dry-run
          fi
