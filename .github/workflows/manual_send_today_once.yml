name: Manual Send Today Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual_send_today_once.yml"

permissions:
  contents: write

concurrency:
  group: arxiv-daily-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check today's marker
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Shanghai date +%F)"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          git fetch origin main
          LAST_SENT="$(git show origin/main:.state/last_sent_date 2>/dev/null | tr -d '\r\n' || true)"
          if [[ "$LAST_SENT" == "$TODAY" ]]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "Already sent today; skipping duplicate."
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: ${{ steps.decision.outputs.send == 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: ${{ steps.decision.outputs.send == 'true' }}
        run: pip install -r requirements.txt

      - name: Send today's translated digest
        if: ${{ steps.decision.outputs.send == 'true' }}
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_MODE: ${{ secrets.SMTP_MODE }}
        run: python send_translated_digest.py

      - name: Mark today as sent
        if: ${{ steps.decision.outputs.send == 'true' && success() }}
        env:
          TODAY: ${{ steps.decision.outputs.today }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          mkdir -p .state
          printf '%s\n' "$TODAY" > .state/last_sent_date
          git add .state/last_sent_date
          git commit -m "chore: mark arXiv digest sent $TODAY" || exit 0
          git push origin main
