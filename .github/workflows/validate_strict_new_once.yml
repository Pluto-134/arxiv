name: Validate Strict New Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate_strict_new_once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Count strict new papers
        run: |
          python - <<'PY'
          from daily_source import fetch_papers
          from fetch_and_mail import filter_papers, load_rules
          papers = fetch_papers()
          selected = filter_papers(papers, load_rules())
          print(f"STRICT_NEW_CANDIDATES={len(papers)}")
          print(f"STRICT_NEW_SELECTED={len(selected)}")
          for p in selected:
              print(f"[{p.score:>2}] {p.title} | {p.link}")
          PY
