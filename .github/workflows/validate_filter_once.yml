name: Validate Filter Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate_filter_once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate current filter without sending email
        run: python fetch_and_mail.py --dry-run
