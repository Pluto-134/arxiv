name: Send Corrected Today Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/send_corrected_today_once.yml"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send corrected ranked digest
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_MODE: ${{ secrets.SMTP_MODE }}
        run: |
          python - <<'PY'
          from daily_source import fetch_papers
          from daily_ranker import select_daily_papers
          from fetch_and_mail import load_rules, send_email
          from send_translated_digest import build_translated_email

          papers = fetch_papers()
          selected = select_daily_papers(papers, load_rules())
          print(f"CORRECTED_SELECTED={len(selected)}")
          subject, plain, html_body = build_translated_email(selected)
          subject = subject + " | CORRECTED"
          plain = "CORRECTED VERSION — please ignore the earlier 128-paper email.\n\n" + plain
          html_body = html_body.replace("<body ", "<body ", 1).replace(
              "<h2 ",
              "<p style='padding:10px 12px;background:#fff8c5;border-radius:6px;'>CORRECTED VERSION — please ignore the earlier 128-paper email.</p><h2 ",
              1,
          )
          send_email(subject, plain, html_body)
          print("Corrected digest sent successfully.")
          PY
