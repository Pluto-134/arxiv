# These topics are not absolutely blocked. They subtract score so that a strong
# transferable robotics method can still pass the threshold.
negative_groups:
  low_priority_domains:
    weight: -6
    terms:
      - surgical robot
      - surgical robotics
      - rehabilitation robot
      - rehabilitation robotics
      - medical robot
      - medical robotics
      - social robot
      - social robotics
      - human-robot interaction
      - human robot interaction
      - swarm robotics
      - swarm robot
      - formation control
      - warehouse scheduling
      - soft robotics
      - soft robot
      - continuum robot

  driving_only:
    weight: -4
    terms:
      - autonomous driving
      - self-driving
      - autonomous vehicle
      - autonomous vehicles
      - driving policy
