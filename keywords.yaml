# High-precision robotics paper filtering rules.
# Stage 1: an explicit robotics/embodied anchor OR cs.RO membership is required.
# Stage 2: interest groups are scored from title + abstract.

threshold: 5
title_bonus: 2

# These terms are allowed to prove robotics/embodied relevance by themselves.
# Generic words such as manipulation/navigation/world model are intentionally NOT here.
strong_robot_anchors:
  - robot
  - robotic
  - robotics
  - autonomous robot
  - mobile robot
  - field robot
  - service robot
  - manipulator
  - robotic arm
  - robot arm
  - robotic hand
  - robot hand
  - dexterous hand
  - robot manipulation
  - robotic manipulation
  - robotic grasping
  - mobile manipulation
  - loco-manipulation
  - humanoid
  - humanoid robot
  - bipedal robot
  - quadruped
  - quadrupedal
  - legged robot
  - legged robotics
  - robot locomotion
  - uav
  - drone
  - quadrotor
  - aerial robot
  - aerial robotics
  - micro aerial vehicle
  - embodied ai
  - embodied intelligence
  - embodied agent
  - embodied reasoning
  - embodied navigation
  - embodied manipulation
  - physical ai
  - physical intelligence
  - vision-language-action
  - vision language action
  - vla model
  - vla models
  - vla policy
  - vla policies
  - robot foundation model
  - robotic foundation model
  - generalist robot
  - robot policy
  - robotic policy
  - vision-language navigation
  - vision language navigation
  - task and motion planning
  - whole-body control
  - whole body control

# Small ranking prior. It does not bypass the interest-score threshold.
category_bonus:
  cs.RO: 1

