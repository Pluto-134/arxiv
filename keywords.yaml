      - vision language action
      - vla model
      - vla policy
      - robot foundation model
      - robotic foundation model
      - generalist robot
      - generalist robotic policy
      - language-conditioned robot
      - language conditioned robot

  embodied_ai:
    weight: 6
    terms:
      - embodied ai
      - embodied intelligence
      - embodied reasoning
      - embodied agent
      - physical intelligence
      - robot reasoning
      - robotic reasoning

  navigation_planning:
    weight: 5
    requires_robot_context: true
    terms:
      - robot navigation
      - autonomous navigation
      - path planning
      - motion planning
      - trajectory planning
      - trajectory optimization
      - local planning
      - global planning
      - navigation policy
      - collision avoidance
      - obstacle avoidance

  active_perception_exploration:
    weight: 7
    requires_robot_context: true
    terms:
      - active perception
      - active sensing
      - informative planning
      - information-aware planning
      - information aware planning
      - visibility-aware
      - visibility aware
      - field-of-view
      - field of view
      - fov-aware
      - fov constrained
      - exploration
      - autonomous exploration
      - next-best-view
      - next best view

  world_models:
    weight: 7
    requires_robot_context: true
    terms:
      - world model
      - world models
      - action-conditioned world model
      - action conditioned world model
      - predictive world model
      - latent dynamics
      - future prediction

  robot_learning:
