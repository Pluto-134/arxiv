# Paper filtering rules. Matching is case-insensitive and checks title + abstract.
# A group contributes its weight once when any term in that group is matched.

threshold: 5
title_bonus: 2

robot_context:
  - robot
  - robotic
  - robotics
  - embodied
  - manipulation
  - manipulator
  - locomotion
  - navigation
  - autonomous agent
  - physical agent
  - humanoid
  - quadruped
  - legged
  - drone
  - uav
  - quadrotor
  - aerial

interest_groups:
  aerial_robotics:
    weight: 7
    terms:
      - uav
      - drone
      - quadrotor
      - aerial robot
      - aerial robotics
      - micro aerial vehicle
      - mav
      - aerial manipulation

  legged_robotics:
    weight: 7
    terms:
      - quadruped
      - quadrupedal
      - legged robot
      - legged robotics
      - legged locomotion
      - robot dog
      - rough-terrain locomotion

  humanoid_robotics:
    weight: 7
    terms:
      - humanoid
      - humanoid robot
      - bipedal robot
      - biped locomotion

  manipulation:
    weight: 7
    terms:
      - robotic arm
      - robot arm
      - robot manipulator
      - robotic manipulation
      - robot manipulation
      - mobile manipulation
      - mobile manipulator
      - loco-manipulation
      - loco manipulation
      - bimanual manipulation
      - dual-arm manipulation

  dexterous_manipulation:
    weight: 8
